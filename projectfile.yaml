  name: crystal
  summary:
    en: Community-maintained distribution of Crystal based on B19/Ubuntu
    es: Distribución de Crystal mantenida por la comunidad, basada en B19/Ubuntu
    uk: Дистрибуція Crystal з підтримкою спільноти на основі B19/Ubuntu
  title: B19/Crystal
  description:
    en: Community-maintained distribution of Crystal built on B19/Ubuntu. This repository holds only the packaging — Dockerfile, build scripts, and configuration, all MIT-licensed; the upstream Crystal is fetched at build time and retains its own licensing.
    es: Distribución de Crystal mantenida por la comunidad, construida sobre B19/Ubuntu. Este repositorio contiene únicamente el empaquetado — Dockerfile, scripts de compilación y configuración, todo con licencia MIT; el código original de Crystal se obtiene en tiempo de compilación y conserva su propia licencia.
    uk: Дистрибуція Crystal з підтримкою спільноти, зібрана на основі B19/Ubuntu. Цей репозиторій містить лише пакування — Dockerfile, скрипти збирання та конфігурацію, усе під ліцензією MIT; вихідний код Crystal отримують під час збирання, і він зберігає власну ліцензію.
